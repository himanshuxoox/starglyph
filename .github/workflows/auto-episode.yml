name: Auto episode (2 Shorts a day)

# Runs every 4 hours. If the next episode's code is in the repo and nothing is already
# scheduled far ahead, it renders that episode and uploads it as a scheduled Short in the
# next free slot (PUBLISH_SLOTS IST, default 12:30 and 17:30). Otherwise it exits in seconds.
on:
  schedule:
    - cron: "30 */4 * * *"      # every 4 h (03:30, 07:30, 11:30 ... UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:                 # one pick+render at a time, so the same episode is never picked twice
  group: auto-episode
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-24.04
    outputs:
      episode: ${{ steps.next.outputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - id: next
        run: |
          git pull --ff-only || true
          python3 scripts/next_episode.py

  render:
    needs: pick
    if: needs.pick.outputs.episode != ''
    uses: ./.github/workflows/render-episode.yml
    with:
      episode: ${{ needs.pick.outputs.episode }}
      upload: true
    secrets: inherit
